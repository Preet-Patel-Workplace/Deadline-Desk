<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deadline Desk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Deadline Desk</h1>
      <p>Every assignment, quiz and exam across your courses — ranked by what's coming next.</p>
      <p class="sync-status" id="syncStatus"></p>
    </div>
    <div class="header-actions" id="headerActions" hidden>
      <div class="user-chip" id="userChip" hidden>
        <img id="userPhoto" alt="" referrerpolicy="no-referrer" hidden>
        <span id="userName"></span>
        <button class="link-btn" id="signOutBtn" type="button">Sign out</button>
      </div>
      <button class="add-btn secondary" id="calBtn" type="button" title="Download all upcoming deadlines as a calendar file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 14v4M10 16h4"/></svg>
        Add to calendar
      </button>
      <button class="add-btn" id="openAdd" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add deadline
      </button>
    </div>
  </header>

  <!-- Shown when Firebase is set up but nobody is signed in -->
  <div class="gate" id="gate" hidden>
    <h2>Sign in to see your deadlines</h2>
    <p>Your list syncs to every device you sign in on.</p>
    <button class="add-btn" id="signInBtn" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1H12v2.9h5.35c-.5 2.4-2.6 3.9-5.35 3.9a6 6 0 1 1 0-12c1.5 0 2.85.55 3.9 1.45l2.15-2.15A9 9 0 1 0 21 12c0-.3 0-.6-.05-.9z"/></svg>
      Sign in with Google
    </button>
  </div>

  <main id="app" hidden>
    <div class="stats">
      <div class="stat overdue"><div class="num" id="statOverdue">0</div><div class="lbl">Overdue</div></div>
      <div class="stat week"><div class="num" id="statWeek">0</div><div class="lbl">Due this week</div></div>
      <div class="stat"><div class="num" id="statUpcoming">0</div><div class="lbl">Upcoming</div></div>
      <div class="stat next"><div class="num" id="statNext">—</div><div class="lbl">Next up</div></div>
    </div>

    <div class="filterbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="fSearch" placeholder="Search course or title…">
      </div>
      <select class="chip-select" id="fType"><option value="all">All types</option></select>
      <select class="chip-select" id="fMode">
        <option value="all">Online + In-person</option>
        <option value="Online">Online only</option>
        <option value="In-person">In-person only</option>
      </select>
      <select class="chip-select" id="fCourse"><option value="all">All courses</option></select>
      <label class="toggle-completed"><input type="checkbox" id="fCompleted"> Show completed</label>
    </div>

    <div id="sections"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Add deadline</h3>
    <form id="form">
      <div class="field">
        <label for="fdCourse">Course</label>
        <input type="text" id="fdCourse" list="courseList" placeholder="e.g. CS 301 – Data Structures" required>
        <datalist id="courseList"></datalist>
      </div>
      <div class="field">
        <label for="fdTitle">What's due</label>
        <input type="text" id="fdTitle" placeholder="e.g. Homework 2 – Linked Lists" required>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fdType">Type</label>
          <select id="fdType">
            <option>Assignment</option><option>Quiz</option><option>Project</option><option>Lab</option>
            <option>Midterm Exam</option><option>Final Exam</option><option>Reading</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Mode</label>
          <div class="seg" id="fdModeSeg">
            <button type="button" data-mode="Online">Online</button>
            <button type="button" data-mode="In-person">In-person</button>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fdDate">Due date</label>
          <input type="date" id="fdDate" required>
        </div>
        <div class="field">
          <label for="fdTime">Due time</label>
          <input type="time" id="fdTime">
        </div>
      </div>
      <div class="field">
        <label for="fdLoc" id="fdLocLabel">Location / link</label>
        <input type="text" id="fdLoc" placeholder="e.g. Room B12, or course portal">
      </div>
      <div class="field">
        <label for="fdNotes">Notes (optional)</label>
        <textarea id="fdNotes" placeholder="Anything worth remembering — weighting, materials to bring…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="deleteBtn" style="display:none;color:var(--danger);">Delete</button>
        <div style="flex:1;"></div>
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Add deadline</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
